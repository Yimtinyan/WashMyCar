<script>for(const [group,items]of [['phone',[['P01','出发首页'],['P04','药剂馆与协调瓶型'],['P05','购入标签与使用履历'],['P10','洗车时长、地点及用量汇总'],['P11','外观与偏好'],['P12','深色外观'],['P13','洗后完成'],['P20','火球药剂检视'],['P21','火球使用履历']]],['watch',[['W02','当前步骤与配液'],['W07','彩蛋 · 爱车闪光'],['W08','彩蛋 · 清爽光环'],['W09','彩蛋 · 爱车夸夸'],['W10','本次完成']]]]){document.getElementById(group).innerHTML=items.map(([id,label])=>{const src='previews/'+(group==='phone'?'iphone':'watch')+'-'+id+'.png';return '<figure><a href="'+src+'"><img loading="lazy" src="'+src+'" alt="'+label+'"></a><figcaption>'+id+' · '+label+'</figcaption></figure>';}).join('');}</script></html>
