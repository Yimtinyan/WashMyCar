<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WashMyCar · Figma本地连接</title><style>body{margin:0;background:#f8faf9;color:#1d3137;font:16px/1.7 system-ui,'Microsoft YaHei',sans-serif}main{max-width:700px;margin:8vh auto;padding:28px}h1{font-size:28px}section{border-top:1px solid #dee7e7;padding:22px 0}button{border:0;border-radius:9px;background:#116a70;color:#fff;padding:12px 18px;font:inherit;cursor:pointer}input{padding:10px;width:100%;box-sizing:border-box;border:1px solid #ccdada;border-radius:8px;font:inherit}code{word-break:break-all}small{color:#586a71}pre{white-space:pre-wrap;background:#f0f5f4;padding:16px;border-radius:12px;font:13px/1.7 system-ui}#secret{display:none}a{color:#116a70}</style><main><h1>Figma 本地连接</h1><p>这个页面只连接本机服务。将连接密钥复制到 Figma 桌面版的 WashMyCar Local Control 插件，点击连接。</p><section><label>本次连接密钥<input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴当前服务生成的密钥"></label><p><button id="copy">复制连接密钥</button> <button id="refresh">检查连接</button></p><small>密钥每次重启改变；不需要 Figma API Token。</small></section><section><strong>连接状态</strong><pre id="status">正在检查…</pre></section><section><p>Figma Desktop → 打开项目 → Plugins → Development → Import plugin from manifest…</p><p>选择项目中的 <code>tools/figma-local/plugin/manifest.json</code>，运行插件后保持插件面板打开。</p><a href="https://www.figma.com/design/8ZDZ8qg4qoMJTtnXDQghDr">打开 WashMyCar 设计稿</a></section></main><script>const t=document.getElementById('token'),out=document.getElementById('status');t.value=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(t.value);out.textContent='已复制。请到 Figma 插件中粘贴。';}catch{t.type='text';t.select();out.textContent='请手动复制选中的密钥。';}};async function refresh(){if(!t.value){out.textContent='请从启动器打开此页面以载入连接密钥。';return;}try{const r=await fetch('/v1/status',{headers:{Authorization:'Bearer '+t.value}}),s=await r.json();if(!r.ok)throw new Error(s.error);const clients=s.clients.filter(c=>c.connected);out.textContent=clients.length?clients.map(c=>c.fileName+'\n文件：'+c.fileKey+'\n'+(c.fileKey===s.expectedFileKey?'已连接目标文件，可接收修改指令':'当前文件不是目标设计稿')).join('\n\n'):'本地服务正常，等待 Figma 插件连接。';}catch(e){out.textContent=e.message;}}document.getElementById('refresh').onclick=refresh;setInterval(refresh,3000);refresh();</script></html>
