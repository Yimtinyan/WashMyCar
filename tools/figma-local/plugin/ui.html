<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box}body{margin:0;padding:20px;font:13px/1.6 Inter,"Microsoft YaHei",sans-serif;color:var(--figma-color-text,#20353a);background:var(--figma-color-bg,#f8faf9)}h1{font-size:18px;margin:0 0 6px}p{margin:6px 0 14px;color:var(--figma-color-text-secondary,#63757c)}label{display:block;font-size:12px;margin:12px 0 5px}input{width:100%;height:38px;padding:8px 10px;border:1px solid var(--figma-color-border,#d8e2e2);background:var(--figma-color-bg,#fff);color:inherit;border-radius:7px;font:inherit}button{border:0;border-radius:8px;padding:10px 14px;font:inherit;background:#116a70;color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;margin:13px 0}#disconnect{background:var(--figma-color-bg-secondary,#e8eeee);color:inherit}.status{padding:10px 12px;border-radius:8px;background:var(--figma-color-bg-secondary,#edf3f2);margin:12px 0;font-size:12px;overflow-wrap:anywhere}dl{margin:12px 0;font-size:11px}dt{color:var(--figma-color-text-secondary,#63757c)}dd{margin:0 0 6px;overflow-wrap:anywhere}#recent{font-size:11px;max-height:76px;overflow:auto;white-space:pre-wrap;color:var(--figma-color-text-secondary,#63757c)}.small{font-size:10px}
</style></head><body>
<h1>WashMyCar 本地控制</h1><p>保持此插件打开，让本机助手检查和调整当前文件。</p>
<label for="token">本次连接口令</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴本地服务生成的口令">
<div class="actions"><button id="connect">连接本地服务</button><button id="disconnect" disabled>断开</button></div>
<div class="status" id="status" role="status" aria-live="polite">尚未连接 · localhost:3847</div>
<dl><dt>当前文件</dt><dd id="fileName">等待 Figma 信息…</dd><dt>真实文件键</dt><dd id="fileKey">读取中</dd><dt>当前命令目标</dt><dd id="expectedKey">尚无命令</dd><dt>当前页面</dt><dd id="pageId">—</dd></dl>
<div id="recent">尚无操作</div><p class="small">口令只在本次内存中保留。仅连接本机地址；无法确认文件身份时禁止写入。</p>
<script>
const BASE='http://localhost:3847';
const $=id=>document.getElementById(id), clientId=(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'client-'+Date.now()+'-'+Math.random().toString(16).slice(2);
let token='', epoch=0, connected=false, meta=null, busy=null, pollTimer=null, beatTimer=null, errors=0;
const waiting=new Map();
function status(text){$('status').textContent=text;}
function buttons(){ $('connect').disabled=connected; $('disconnect').disabled=!connected; $('token').disabled=connected; }
function log(text){$('recent').textContent=new Date().toLocaleTimeString()+'  '+text;}
function send(message){parent.postMessage({pluginMessage:message},'*');}
async function request(path,method='GET',body){const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),10000);try{const r=await fetch(BASE+path,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:abort.signal,cache:'no-store'});let result;try{result=await r.json();}catch{throw new Error('服务返回了无法识别的内容');}if(!r.ok)throw new Error(result.error?.message||result.error||('HTTP '+r.status));return result;}finally{clearTimeout(timer);}}
function stop(){epoch++;connected=false;clearTimeout(pollTimer);clearTimeout(beatTimer);send({type:'disconnect'});for(const item of waiting.values())item.reject(new Error('连接已断开；已领取的写命令不会自动重新执行'));waiting.clear();busy=null;token='';$('token').value='';buttons();status('已断开 · 当前画布不会再接收新命令');}
async function heartbeat(current){if(!connected||current!==epoch)return;try{send({type:'metadata'});if(meta)await request('/v1/clients','POST',{clientId,...meta});}catch(e){if(current===epoch)status('心跳失败：'+e.message);}finally{if(connected&&current===epoch)beatTimer=setTimeout(()=>heartbeat(current),5000);}}
function runCommand(command){$('expectedKey').textContent=command.expectedFileKey||'未指定（仅允许读取）';const write=['patch','createText','createFrame','navigate','compose','wire','paintImage'].includes(command.op);if((command.expectedFileKey&&command.expectedFileKey!==meta?.fileKey)||(write&&(!meta?.fileKey||!command.expectedFileKey))){status('目标文件未核验：禁止执行写入。');return Promise.resolve({id:command.id,ok:false,error:{message:'Current file identity does not match the command target; no changes were made'}});}return new Promise((resolve,reject)=>{waiting.set(command.id,{resolve,reject});send({type:'command',command});});}
async function deliverResult(current,response){for(let i=0;i<3;i++){if(!connected||current!==epoch)throw new Error('连接已断开');try{return await request('/v1/results','POST',{clientId,...response});}catch(e){if(i===2)throw e;await new Promise(resolve=>setTimeout(resolve,500*(i+1)));}}}
async function poll(current){if(!connected||current!==epoch||busy)return;let delay=900;try{const {command}=await request('/v1/commands?clientId='+encodeURIComponent(clientId));errors=0;if(!connected||current!==epoch)return;if(command){busy=command.id;status('正在执行 '+command.op+'…');log(command.op+' · '+command.id);const response=await runCommand(command);if(!connected||current!==epoch)return;await deliverResult(current,response);status(response.ok?'已连接 · 最近操作完成':'已连接 · 最近操作失败');log(command.op+' · '+(response.ok?'完成':response.error?.message||'失败'));busy=null;}}catch(e){if(current!==epoch)return;errors++;delay=Math.min(15000,1000*Math.pow(2,Math.min(errors,4)));if(busy){const failedId=busy;stop();status('结果回传失败；已断开，请先核对画布再连接。');log(failedId+' · '+e.message);return;}status('本地服务暂不可达，正在重连…');log(e.message);}finally{if(connected&&current===epoch)pollTimer=setTimeout(()=>poll(current),delay);}}
$('connect').onclick=async()=>{if(connected)return;const value=$('token').value.trim();if(value.length<16){status('请粘贴本地服务生成的完整口令。');return;}token=value;const current=++epoch;$('connect').disabled=true;status('正在连接…');try{await request('/v1/connect','POST',{clientId});if(current!==epoch)return;send({type:'bind'});await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{waiting.delete('bind');reject(new Error('未收到 Figma 文件身份信息'));},5000);waiting.set('bind',{resolve:()=>{clearTimeout(timeout);resolve();},reject});});if(current!==epoch)return;connected=true;errors=0;buttons();status(meta?.fileKey?'已连接 · 仅操作当前已核验文件':'已连接只读 · 无法取得文件键');await heartbeat(current);poll(current);}catch(e){if(current!==epoch)return;connected=false;token='';buttons();status('连接失败：'+e.message);}};
$('disconnect').onclick=stop;
window.onmessage=event=>{
  // Figma can relay sandbox messages through an intermediate frame/WindowProxy.
  // Follow its documented pluginMessage envelope instead of comparing source
  // identity with parent; every canvas write is independently file-key checked.
  const envelope=event.data;
  if(!envelope||typeof envelope!=='object'||!envelope.pluginMessage)return;
  const message=envelope.pluginMessage;
  if(typeof message!=='object'||!['metadata','bound','result'].includes(message.type))return;
  if(message.type==='metadata'||message.type==='bound'){
    const next=message.metadata;
    if(!next||typeof next!=='object'||typeof next.fileName!=='string'||typeof next.pageId!=='string'||!(next.fileKey===null||typeof next.fileKey==='string'))return;
    meta=next;$('fileName').textContent=meta.fileName||'未命名';$('fileKey').textContent=meta.fileKey||'不可用：禁止写入';$('pageId').textContent=meta.pageId||'—';
    if(message.type==='bound'){const bind=waiting.get('bind');if(bind){waiting.delete('bind');bind.resolve();}}
  }else if(message.type==='result'){
    const response=message.response;
    if(!response||typeof response.id!=='string'||typeof response.ok!=='boolean')return;
    const item=waiting.get(response.id);if(item){waiting.delete(response.id);item.resolve(response);}
  }
};
send({type:'metadata'});
</script></body></html>
